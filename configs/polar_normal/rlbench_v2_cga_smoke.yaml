data:
  format: rlbench_polar_lmdb
  dataset_root: robot_data/rlbench/lerobot_point_lmdb/hybridvla_10tasks_train_keysteps_polar_rlbench9_v2
  train_manifest: robot_data/polar_normal_rlbench_v2_manifests/train.jsonl
  val_manifest: robot_data/polar_normal_rlbench_v2_manifests/val.jsonl
  input_mode: robot
  image_size: 64
  normal_gt_source: archived Coppelia depth + same-object mask finite-difference normals
  overfit_samples: 2

model:
  use_dino: false
  transformer_blocks: 1
  transformer_dropout: 0.0

training:
  output_dir: outputs/rlbench_v2_cga_normal_smoke
  seed: 7
  device: cpu
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 1
  num_workers: 0
  learning_rate: 1.0e-4
  step_size: 10
  gamma: 0.5
